<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <span class="mark">20</span>
      <div>
        <p class="eyebrow">{{ i18n.t('app.eyebrow') }}</p>
        <h1>GPT Dice Adventure</h1>
      </div>
    </div>
    <div class="toolbar">
      <button type="button" [title]="i18n.t('nav.gamesTitle')" [class.current]="view() === 'sessions'" (click)="showSessions()">{{ i18n.t('nav.games') }}</button>
      <button type="button" [title]="i18n.t('nav.newTitle')" [class.current]="view() === 'setup'" (click)="newGame()">{{ i18n.t('nav.new') }}</button>
      <app-settings-menu
        [images]="session()?.images ?? true"
        [imagesAvailable]="!!session()"
        (toggleImages)="toggleImages()"
        (setLanguage)="setLanguage($event)"
      />
    </div>
  </header>

  <div class="layout">
    <aside class="dice-rail">
      <app-dice-roll [roll]="shownRoll()" [rolling]="!!dice()" (finished)="finishDice()" />
    </aside>

    <main class="story-column">
      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      @switch (view()) {
        @case ('sessions') {
          <app-session-list
            class="fill"
            [sessions]="sessions()"
            [activeId]="session()?.id ?? null"
            [loading]="sessionsLoading()"
            (openSession)="openSession($event)"
            (deleteSession)="deleteSession($event)"
            (newGame)="newGame()"
            (closeList)="view.set('play')"
          />
        }
        @case ('setup') {
          <app-character-setup [settings]="settings()" [busy]="busy()" (createSession)="create($event)" />
          <div class="fill"></div>
        }
        @default {
          <app-story-timeline class="fill" [nodes]="session()?.nodes ?? []" [images]="session()?.images ?? true" />

          @if (session()) {
            <app-action-composer
              class="composer"
              [disabled]="busy() || !!session()?.dead"
              [busy]="busy()"
              [suggestions]="session()?.dead ? [] : (session()?.suggestedActions ?? [])"
              (sendAction)="sendAction($event)"
            />
          }
        }
      }
    </main>

    <aside class="sidebar" [attr.aria-label]="i18n.t('dock.resources')">
      <app-session-dock [session]="session()" />
    </aside>
  </div>

</div>
