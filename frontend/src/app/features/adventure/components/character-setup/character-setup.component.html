<form class="setup-panel" (ngSubmit)="submit()">
  <label>
    {{ i18n.t('setup.name') }}
    <input name="name" type="text" maxlength="28" autocomplete="off" [placeholder]="i18n.t('setup.namePlaceholder')" [(ngModel)]="model.name" />
  </label>
  <label>
    {{ i18n.t('setup.background') }}
    <input
      name="concept"
      type="text"
      maxlength="80"
      autocomplete="off"
      [placeholder]="i18n.t('setup.backgroundPlaceholder')"
      [(ngModel)]="model.concept"
    />
  </label>
  <label>
    {{ i18n.t('setup.setting') }}
    <input
      name="setting"
      type="text"
      maxlength="120"
      autocomplete="off"
      list="setting-suggestions"
      [placeholder]="i18n.t('setup.settingPlaceholder')"
      [(ngModel)]="model.setting"
    />
    <datalist id="setting-suggestions">
      @for (setting of settings; track setting.id) {
        <option [value]="i18n.server(setting.label)"></option>
      }
    </datalist>
  </label>
  <button type="submit" [disabled]="busy || !complete">{{ i18n.t(busy ? 'setup.creating' : 'setup.create') }}</button>
</form>
