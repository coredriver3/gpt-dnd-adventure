<form class="composer" (ngSubmit)="submit()">
  @if (suggestions.length > 0) {
    <div class="suggestions">
      @for (suggestion of suggestions; track suggestion) {
        <button type="button" class="suggestion" [disabled]="disabled" (click)="choose(suggestion)">
          {{ suggestion }}
        </button>
      }
    </div>
  }
  <input
    name="action"
    type="text"
    autocomplete="off"
    maxlength="500"
    [placeholder]="i18n.t(busy ? 'composer.thinking' : 'composer.placeholder')"
    [disabled]="disabled"
    [(ngModel)]="text"
  />
  <button type="submit" class="act" [disabled]="disabled">{{ busy ? '...' : i18n.t('composer.act') }}</button>
</form>
