# Started and stopped automatically by Spring Boot's Docker Compose support when the backend runs.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gpt_dnd_adventure
      POSTGRES_USER: gpt_dnd
      POSTGRES_PASSWORD: gpt_dnd_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
