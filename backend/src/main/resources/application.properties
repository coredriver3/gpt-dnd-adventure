spring.application.name=gpt-dnd-adventure
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/gpt_dnd_adventure}
spring.datasource.username=${DB_USERNAME:gpt_dnd}
spring.datasource.password=${DB_PASSWORD:gpt_dnd_dev}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

adventure.ai.endpoint=${ADVENTURE_AI_ENDPOINT:}
adventure.ai.api-key=${ADVENTURE_AI_API_KEY:}
