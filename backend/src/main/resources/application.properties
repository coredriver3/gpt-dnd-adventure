spring.application.name=gpt-dnd-adventure
server.port=8080
spring.config.import=optional:file:./application-local.properties

# The database comes from compose.yaml (Spring Boot Docker Compose support). To use an external
# database instead, set spring.docker.compose.enabled=false and the spring.datasource.* properties.
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# auto: Claude if its key is set, else OpenRouter if its key is set, else the local rule-based narrator.
adventure.story.provider=${ADVENTURE_STORY_PROVIDER:auto}
adventure.ai.api-key=${ANTHROPIC_API_KEY:}
adventure.ai.model=${ADVENTURE_AI_MODEL:claude-opus-5-5}
adventure.openrouter.api-key=${OPENROUTER_API_KEY:}
adventure.openrouter.model=${OPENROUTER_MODEL:nvidia/nemotron-3.5-super-vl:free}
adventure.ai.history-nodes=40
