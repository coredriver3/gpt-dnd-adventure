<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPT Dice Adventure</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="game-area">
        <header class="topbar">
          <div class="brand">
            <span class="mark">20</span>
            <div>
              <p class="eyebrow">Prototype</p>
              <h1>GPT Dice Adventure</h1>
            </div>
          </div>
          <div class="toolbar">
            <button id="newGameBtn" type="button" title="Start new game">New</button>
            <button id="imageToggle" type="button" title="Toggle generated scene cards">Images on</button>
            <button id="languageToggle" type="button" title="Switch language">DE</button>
          </div>
        </header>

        <form id="setupForm" class="setup-panel">
          <div class="setup-grid">
            <label>
              Name
              <input id="characterName" type="text" value="Mara" maxlength="28" />
            </label>
            <label>
              Concept
              <input id="characterConcept" type="text" value="runaway cartographer" maxlength="80" />
            </label>
            <label>
              Setting
              <select id="setting">
                <option value="dark-fantasy">Dark fantasy borderlands</option>
                <option value="arcane-city">Arcane city intrigue</option>
                <option value="post-empire">Post empire ruins</option>
                <option value="german-folklore">German folklore woods</option>
              </select>
            </label>
            <button type="submit">Create</button>
          </div>
        </form>

        <section class="timeline-wrap" aria-label="Story path">
          <div id="timeline" class="timeline"></div>
        </section>

        <div class="action-dock">
          <form id="actionForm" class="composer">
            <input
              id="playerInput"
              type="text"
              autocomplete="off"
              placeholder="Was tust du? Oder [inventory], [status], [roll d20+2] ..."
            />
            <button type="submit">Act</button>
          </form>

          <section class="bottom-panel" aria-label="Character state">
            <div class="character-summary">
              <strong id="characterSummary">No character</strong>
              <span id="settingSummary">Create a new run first</span>
            </div>
            <div class="meter danger">
              <span>Health</span>
              <strong id="healthText">10 / 10</strong>
              <i id="healthBar"></i>
            </div>
            <div class="meter">
              <span>Resolve</span>
              <strong id="resolveText">6 / 6</strong>
              <i id="resolveBar"></i>
            </div>
            <div>
              <h2>Resources</h2>
              <ul id="resources" class="compact-list"></ul>
            </div>
            <div>
              <h2>Inventory</h2>
              <ul id="inventory" class="tag-list"></ul>
            </div>
          </section>
        </div>
      </main>
    </div>

    <template id="nodeTemplate">
      <article class="story-node">
        <div class="node-pin"></div>
        <div class="node-card">
          <div class="node-header">
            <span class="node-type"></span>
            <span class="roll-chip"></span>
          </div>
          <div class="node-image" role="img"></div>
          <p class="node-text"></p>
          <div class="consequences"></div>
        </div>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
